<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Generator - Birthday Card</title>
  <style>
    body{font-family:Arial,sans-serif;background:#111827;color:white;display:grid;place-items:center;min-height:100vh;margin:0}
    .box{width:min(90%,520px);padding:30px;background:#1f2937;border-radius:20px;text-align:center}
    input{width:100%;padding:13px;border-radius:10px;border:0;margin:12px 0;box-sizing:border-box}
    button{padding:12px 20px;border:0;border-radius:999px;cursor:pointer;font-weight:bold}
    #qrcode{margin:25px auto;background:white;padding:15px;width:max-content}
    small{color:#cbd5e1}
  </style>
</head>
<body>
  <div class="box">
    <h1>🎁 QR Birthday Card</h1>
    <p>Masukkan URL website kartu ulang tahunmu.</p>
    <input id="url" placeholder="https://username.github.io/birthday-card/">
    <button onclick="makeQR()">Buat QR Code</button>
    <div id="qrcode"></div>
    <small>Setelah muncul, simpan/capture QR Code untuk dibagikan.</small>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    function makeQR(){
      const url = document.getElementById("url").value.trim();
      const box = document.getElementById("qrcode");
      box.innerHTML = "";
      if(!url) return alert("Masukkan URL terlebih dahulu.");
      new QRCode(box, {
        text: url,
        width: 280,
        height: 280,
        correctLevel: QRCode.CorrectLevel.H
      });
    }
  </script>
</body>
</html>
